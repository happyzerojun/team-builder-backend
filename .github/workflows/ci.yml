name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: backend (Gradle build + test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: team_builder
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:mysql://localhost:3306/team_builder?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      # 로그를 열지 않아도 PR 화면(Annotations)에서 결과를 보도록 JUnit XML을 요약한다.
      # 테스트 실행 여부·결과는 바꾸지 않고 읽기만 한다(실패 시에도 실행)
      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          suites = []
          for path in sorted(glob.glob("build/test-results/test/*.xml")):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              suites.append(f"{suite.get('name', '').rsplit('.', 1)[-1]}={suite.get('tests')}")
              skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  problem = case.find("failure")
                  if problem is None:
                      problem = case.find("error")
                  if problem is not None:
                      failed += 1
                      text = (problem.get("message") or problem.text or "").replace("%", "%25").replace("\r", "").replace("\n", "%0A")[:1500]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          print(f"::notice title=Tests::{total} tests, {failed} failed, {skipped} skipped")
          print(f"::notice title=Test classes::{', '.join(suites)}")
          PY

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
