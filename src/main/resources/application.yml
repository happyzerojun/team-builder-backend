server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB # 🚨 [추가] JSON/Base64 텍스트 용량 폭탄 방어!

spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 10MB      # 🚨 [추가]
      max-request-size: 10MB   # 🚨 [추가] 전체 요청 크기 제한 늘리기

  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/team_builder?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET NAMES utf8mb4"

  sql:
    init:
      mode: never # 서버 실행 시마다 src/main/resources/data.sql을 실행함

  jpa:
    hibernate:
      # 기본값은 로컬·현재 배포 호환을 위해 update. 운영은 스키마를 맞춘 뒤 JPA_DDL_AUTO=validate로 실행 권장 (TS-14)
      # update는 컬럼·제약 추가만 하고 타입 변경·삭제·데이터 이전은 하지 않으며, 제약 추가 실패 시 경고만 남긴다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    # OSIV 끔: 영속성 컨텍스트(와 DB 커넥션)를 트랜잭션 범위로 한정한다 (TS-12)
    # 켜 두면 요청이 끝날 때까지 커넥션을 쥐고 있어, 트랜잭션 밖 Gemini 호출(최대 15초) 동안에도 커넥션이 반환되지 않는다.
    # 컨트롤러·DTO 변환에서의 지연 로딩은 모두 서비스 트랜잭션 안으로 옮겼다 (ProjectService 클래스 레벨 readOnly 등)
    open-in-view: false
    show-sql: true
    # Hibernate가 테이블을 다 만든 "후에" SQL이 실행되도록 순서를 조절합니다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect # 사용할 DB 방언 명시 (권장)
        # 지연 로딩 컬렉션·연관을 IN (?, ?, ...)으로 최대 100개씩 묶어 조회 (N+1 → 1+1) (TS-13)
        # 목록 10건이면 기술 스택 연결 10번 + 기술 스택 N번 + 포지션 10번이던 쿼리가 각각 1번으로 줄어든다
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          # 소셜 로그인은 Google만 운영 (TS-21). Google은 Spring이 provider 정보를 내장하고 있어 provider 블록이 필요 없어요
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

gemini:
  api:
    key: ${GEMINI_API_KEY:dummy-gemini-api-key}
    # 💡 끝에 ?key= 를 떼고 순수 API 주소만 깔끔하게 남겨둡니다.
    url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
jwt:
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  tech-keywords:
    # AI 추천 키워드 맵 주기 재적재 간격(ms). 새 기술 스택은 저장 커밋 직후 이벤트로도 반영된다 (TS-20)
    reload-interval-ms: ${TECH_KEYWORDS_RELOAD_INTERVAL_MS:600000}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback} # 프론트(Vite) /oauth/callback 화면

